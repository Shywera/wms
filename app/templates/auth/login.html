<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava — WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="text-white font-bold text-xl tracking-wider">SKLADIŠTE · WMS</div>
            <div class="text-slate-500 text-xs mt-1">Prijava u sustav</div>
        </div>

        <form method="post" action="/login"
              class="bg-white rounded-xl shadow-lg p-6 space-y-4">
            {% if greska %}
            <div class="border-2 border-red-400 bg-red-50 rounded-lg p-3 text-sm font-semibold text-red-700">
                {{ greska }}
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Korisničko ime</label>
                <input name="username" type="text" autocomplete="username" autofocus required
                       class="w-full border border-gray-400 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">Lozinka</label>
                <input name="lozinka" type="password" autocomplete="current-password" required
                       class="w-full border border-gray-400 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-2.5 transition-colors">
                Prijava
            </button>
        </form>

        <div class="text-center text-slate-600 text-[11px] mt-4">WMS · samostalni modul</div>
    </div>
</body>
</html>
