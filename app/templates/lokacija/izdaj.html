{% extends "base.html" %}
{% block title %}Izdavanje — Skladište{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-xl font-bold text-gray-800 mb-1">Izdavanje palete</h1>
    <p class="text-sm text-gray-500 mb-4">Skeniraj paletu pa potvrdi izdavanje. Jedna paleta po jedna.</p>

    <div class="bg-white rounded-lg border border-gray-300 shadow-md p-4 mb-3">
        <label class="block text-sm font-semibold text-gray-600 mb-2">Skeniraj barkod palete</label>
        <input id="izd-input" name="barkod" type="text" autocomplete="off" autofocus
               placeholder="Skeniraj paletu za izdavanje…"
               hx-get="/lokacija/izdaj/skeniraj" hx-trigger="keydown[key=='Enter']"
               hx-target="#rez" hx-swap="innerHTML"
               class="w-full border-2 border-blue-300 rounded-lg px-4 py-3 text-lg font-mono
                      focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div id="rez"></div>
</div>
{% endblock %}
